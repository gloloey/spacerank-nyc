# refresh_data.yml — SpaceRank NYC: the self-updating dataset
# ============================================================
# Every Monday 09:00 UTC (and on demand via "Run workflow"):
#   1. re-run every scraper (scrape_*.py) on this runner — full internet
#      access here; the polite rate limits in each scraper still apply
#   2. rebuild spaces_clean.csv + dataset_meta.json with clean_dataset.py
#      (PLUTO enrichment from the committed pluto_cache.json snapshot;
#      missing coordinates geocoded live via the free NYC GeoSearch API
#      and cached in geocode_cache.json)
#   3. retrain the rent-estimate model on the fresh published rents
#      (price_model.py is self-gating: it refuses to ship on weak data)
#   4. SANITY GUARD: refuse to commit if any known landlord's row count
#      collapsed below 50% of the previous run — a redesigned website
#      should fail loudly here, not silently wipe the dataset
#   5. commit the fresh CSVs — then explicitly dispatch embeddings.yml
#      (GITHUB_TOKEN pushes don't fire on-push workflows) — which triggers
#      the normal Vercel deploy.

name: refresh-data

on:
  schedule:
    - cron: "0 9 * * 1"     # Mondays 09:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write
  actions: write        # to dispatch embeddings.yml (GITHUB_TOKEN pushes
                        # don't fire on-push workflows — must chain explicitly)

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install scraper deps
        run: pip install requests beautifulsoup4 lxml pandas numpy

      - name: Snapshot previous per-landlord counts
        run: |
          python - <<'PY'
          import pandas as pd, json
          prev = pd.read_csv("spaces_clean.csv").groupby("landlord").size().to_dict()
          json.dump(prev, open("/tmp/prev_counts.json", "w"))
          print("previous:", prev)
          PY

      - name: Run scrapers (polite rate limits inside each script)
        run: |
          for s in scrape_*.py; do
            echo "=== $s ==="
            python "$s"
          done

      - name: Rebuild clean dataset
        run: python clean_dataset.py

      - name: Retrain the rent-estimate model (self-gating)
        run: python price_model.py

      - name: Sanity guard — no landlord may lose >50% of rows
        run: |
          python - <<'PY'
          import pandas as pd, json, sys
          prev = json.load(open("/tmp/prev_counts.json"))
          new = pd.read_csv("spaces_clean.csv").groupby("landlord").size().to_dict()
          bad = [f"{k}: {prev[k]} -> {new.get(k, 0)}"
                 for k in prev if new.get(k, 0) < 0.5 * prev[k]]
          print("new:", new)
          if bad:
              sys.exit("REFUSING TO COMMIT — suspicious row collapse "
                       "(site redesign or scrape failure?): " + "; ".join(bad))
          PY

      - name: Commit refreshed data (if anything changed)
        run: |
          git config user.name "spacerank-refresh-bot"
          git config user.email "actions@github.com"
          git add spaces_clean.csv dataset_meta.json pluto_cache.json geocode_cache.json price_model.json *_listings.csv building_coords.json
          if git diff --cached --quiet; then
            echo "No data changes this week."
          else
            git commit -m "data: weekly refresh ($(date -u +%F))"
            git push
            echo "PUSHED=1" >> "$GITHUB_ENV"
          fi

      - name: Chain the embeddings rebuild (which chains the deploy)
        if: env.PUSHED == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run embeddings.yml --ref main
